<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aavedan · आवेदन — board</title>
<meta name="description" content="Jobs found, ranked against your resume, and every application you sent or that waits for you.">
<meta property="og:title" content="aavedan · आवेदन">
<meta property="og:description" content="Finds jobs in India, remote and worldwide, ranks them against your resume, fills each form in Chrome, checks every answer, and sends only what you approve.">
<meta property="og:image" content="https://samarthjaiswal.github.io/aavedan/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b8461b'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fbf6ec' font-family='serif'%3E%E0%A4%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Yatra+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,650&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f7f2e8; --card: #fffdf8; --ink: #1f1b16; --muted: #6b6257; --line: #e5dccc;
  --accent: #b8461b; --accent-soft: #f6e2d5; --sent: #2e7a4e; --sent-soft: #def0e3;
  --held: #a8660c; --held-soft: #f8ead0; --rehearsed: #4d5f9a; --rehearsed-soft: #e3e7f6;
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 6px 20px rgba(60, 40, 20, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16130f; --card: #1f1b16; --ink: #f1e9dc; --muted: #a99d8c; --line: #3a332a;
    --accent: #ef8a5b; --accent-soft: #3d2519; --sent: #6cc893; --sent-soft: #1d3326;
    --held: #e8ae4c; --held-soft: #3a2c14; --rehearsed: #9cacf0; --rehearsed-soft: #232a45;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --paper: #16130f; --card: #1f1b16; --ink: #f1e9dc; --muted: #a99d8c; --line: #3a332a;
  --accent: #ef8a5b; --accent-soft: #3d2519; --sent: #6cc893; --sent-soft: #1d3326;
  --held: #e8ae4c; --held-soft: #3a2c14; --rehearsed: #9cacf0; --rehearsed-soft: #232a45;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 'Bricolage Grotesque', system-ui, sans-serif; }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.brand { margin: 0; font-weight: 500; line-height: 1; display: flex; align-items: baseline; gap: 12px; }
.brand .latin { font-family: 'Fraunces', serif; font-size: 40px; letter-spacing: -.02em; font-weight: 650; }
.brand .deva { font-family: 'Yatra One', serif; font-size: 34px; color: var(--accent); }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
.who { text-align: right; color: var(--muted); font-size: 13px; }
.who b { color: var(--ink); font-weight: 650; font-size: 15px; display: block; }
.demo { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 10px 14px; margin: 18px 0 0; font-size: 14px; }
.demo a { font-weight: 650; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat .n { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 650; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: 13px; }
.stat.sent .n { color: var(--sent); } .stat.held .n { color: var(--held); }
.week { display: flex; align-items: flex-end; gap: 3px; height: 30px; margin-top: 6px; }
.week span { flex: 1; background: var(--sent); opacity: .75; border-radius: 2px 2px 0 0; min-height: 2px; }
nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
nav button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
nav button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
nav button .c { opacity: .65; margin-left: 4px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.tools input[type=search] { font: inherit; flex: 1 1 220px; min-width: 0; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.tools label { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; }
.tools input[type=range] { accent-color: var(--accent); width: 110px; }
.list { display: grid; gap: 10px; }
.job { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 52px 1fr auto; gap: 4px 14px; align-items: start; box-shadow: var(--shadow); }
.ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 15px; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); position: relative; }
.ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--card); }
.ring span { position: relative; }
.job h3 { margin: 0; font-size: 16px; font-weight: 650; line-height: 1.3; }
.job .co { color: var(--muted); font-size: 14px; }
.job .one { margin: 4px 0 0; font-size: 14px; }
.job details { grid-column: 2 / -1; font-size: 14px; }
.job summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.job ul { margin: 6px 0 0; padding-left: 18px; }
.job li.m::marker { content: '+  '; color: var(--sent); font-weight: 650; }
.job li.g::marker { content: '–  '; color: var(--held); font-weight: 650; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 5px 10px; border-radius: 8px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
code, .cmd { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; text-transform: capitalize; }
.chip.sent { background: var(--sent-soft); color: var(--sent); }
.chip.held { background: var(--held-soft); color: var(--held); }
.chip.rehearsed { background: var(--rehearsed-soft); color: var(--rehearsed); }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td .t { font-weight: 600; }
td:first-child { white-space: nowrap; }
td .r { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); padding: 30px; text-align: center; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; }
.need { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--held); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); }
.need .t { font-weight: 650; }
.need p { margin: 4px 0 8px; color: var(--muted); font-size: 14px; }
footer { margin-top: 36px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.toggle { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.tablewrap { overflow-x: auto; }
@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .brand .latin { font-size: 32px; } .brand .deva { font-size: 27px; }
  .who { text-align: left; }
  .job { grid-template-columns: 46px 1fr; }
  .side { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: flex-start; flex-wrap: wrap; }
  .job details { grid-column: 1 / -1; }
  th:nth-child(4), td:nth-child(4) { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="brand"><span class="latin">aavedan</span> <span class="deva" lang="hi">आवेदन</span></h1>
      <p class="sub">Jobs found, ranked against your resume, and every application you sent.</p>
    </div>
    <div class="who" id="who"></div>
  </header>
  <div id="demo"></div>
  <section class="stats" id="stats"></section>
  <nav role="tablist" id="tabs"></nav>
  <div class="tools" id="tools"></div>
  <main id="view"></main>
  <footer><span id="gen"></span><button class="toggle" id="theme" type="button">Theme</button></footer>
</div>
<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = iso => iso ? new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';
const safeUrl = u => /^https?:\/\//.test(u || '') ? u : '#';
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem('aavedan:' + k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('aavedan:' + k, JSON.stringify(v)); } catch {} } };

const apps = DATA.applications;
const sent = apps.filter(a => a.status === 'sent');
// Waiting for the person: held forms, and rehearsals that found something only they can answer.
const held = apps.filter(a => a.status === 'held' || (a.status === 'rehearsed' && a.reason));
const rehearsed = apps.filter(a => a.status === 'rehearsed');
const queue = DATA.queue.filter(q => q.status === 'new');
// The demo opens on the queue with a lower bar, so visitors see what ranking looks like.
let state = { tab: store.get('tab', held.length && !DATA.demo ? 'needs' : 'queue'), q: '', minFit: store.get('minFit', DATA.demo ? 40 : DATA.minFit), remote: false, status: 'all' };

const note = DATA.demoNote ?? { who: 'a made-up candidate', banner: 'This is a demo with a made-up candidate and real job postings.' };
$('#who').innerHTML = DATA.name ? `<b>${esc(DATA.name)}</b>${DATA.demo ? esc(note.who) : 'your board'}` : '';
if (DATA.demo) $('#demo').innerHTML = `<p class="demo">${esc(note.banner)} aavedan runs on your own computer: <a href="https://github.com/SAMARTHJAISWAL/aavedan">see how to set it up</a>.</p>`;
$('#gen').textContent = `Updated ${new Date(DATA.generatedAt).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}`;

// Applications sent in each of the last 8 weeks.
const weeks = Array.from({ length: 8 }, (_, i) => sent.filter(a => { const d = (Date.now() - new Date(a.at)) / 864e5; return d >= (7 - i) * 7 && d < (8 - i) * 7; }).length);
const maxW = Math.max(1, ...weeks);
$('#stats').innerHTML = `
  <div class="stat sent"><div class="n">${sent.length}</div><div class="l">sent</div><div class="week" title="Sent per week, last 8 weeks">${weeks.map(w => `<span style="height:${Math.round(w / maxW * 100)}%"></span>`).join('')}</div></div>
  <div class="stat held"><div class="n">${held.length}</div><div class="l">waiting for you</div></div>
  <div class="stat"><div class="n">${rehearsed.length}</div><div class="l">rehearsed, not sent</div></div>
  <div class="stat"><div class="n">${queue.filter(q => q.score >= DATA.minFit).length}</div><div class="l">in the queue, fit ${DATA.minFit}+</div></div>`;

const TABS = [['needs', 'Needs you', held.length], ['queue', 'Queue', queue.length], ['apps', 'Applications', apps.length]];
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, l, c]) => `<button role="tab" aria-selected="${state.tab === k}" data-tab="${k}">${l}<span class="c">${c}</span></button>`).join('');
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.tab = b.dataset.tab; store.set('tab', state.tab); render(); } });

function renderTools() {
  if (state.tab === 'needs') { $('#tools').innerHTML = ''; return; }
  $('#tools').innerHTML = `<input type="search" id="q" placeholder="Search company, role or place" value="${esc(state.q)}" aria-label="Search">` +
    (state.tab === 'queue'
      ? `<label>Fit ≥ <b id="fv">${state.minFit}</b><input type="range" id="fit" min="0" max="100" step="5" value="${state.minFit}"></label><label><input type="checkbox" id="rem" ${state.remote ? 'checked' : ''}> Remote only</label>`
      : `<label>Status <select id="st" class="btn">${['all', 'sent', 'held', 'rehearsed'].map(s => `<option ${state.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>`);
  $('#q').addEventListener('input', e => { state.q = e.target.value; renderView(); });
  $('#fit')?.addEventListener('input', e => { state.minFit = +e.target.value; $('#fv').textContent = state.minFit; store.set('minFit', state.minFit); renderView(); });
  $('#rem')?.addEventListener('change', e => { state.remote = e.target.checked; renderView(); });
  $('#st')?.addEventListener('change', e => { state.status = e.target.value; renderView(); });
}

const match = (...xs) => { const q = state.q.trim().toLowerCase(); return !q || xs.join(' ').toLowerCase().includes(q); };

function renderView() {
  const v = $('#view');
  if (state.tab === 'needs') {
    v.innerHTML = held.length ? `<div class="list">${held.map(a => `
      <div class="need"><div class="t">${esc(a.company)} · ${esc(a.title)}</div>
      <p>${esc(a.reason || 'Waiting for you.')}</p>
      <a class="btn" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">Open posting</a>
      <button class="btn" data-copy="aavedan apply ${esc(a.handle)}${a.status === 'held' ? ' --send' : ''}">Copy: <span class="cmd">aavedan apply ${esc(a.handle)}${a.status === 'held' ? ' --send' : ''}</span></button></div>`).join('')}</div>`
      : `<div class="empty">Nothing waits for you.</div>`;
    return;
  }
  if (state.tab === 'queue') {
    const rows = queue.filter(q => q.score >= state.minFit && (!state.remote || q.remote) && match(q.company, q.title, q.location));
    v.innerHTML = rows.length ? `<div class="list">${rows.map(q => `
      <article class="job">
        <div class="ring" style="--p:${q.score}" title="Fit ${q.score} of 100"><span>${q.score}</span></div>
        <div><h3>${esc(q.title)}</h3><div class="co">${esc(q.company)} · ${esc(q.location || 'Location not stated')}${q.postedAt ? ` · posted ${when(q.postedAt)}` : ''}</div><p class="one">${esc(q.oneLine)}</p></div>
        <div class="side"><a class="btn" href="${esc(safeUrl(q.url))}" target="_blank" rel="noopener">Posting</a><button class="btn" data-copy="aavedan apply ${esc(q.handle)} --send"><span class="cmd">apply ${esc(q.handle)}</span></button></div>
        ${q.matches.length || q.gaps.length ? `<details><summary>Why this score</summary><ul>${q.matches.map(m => `<li class="m">${esc(m)}</li>`).join('')}${q.gaps.map(g => `<li class="g">${esc(g)}</li>`).join('')}</ul></details>` : ''}
      </article>`).join('')}</div>` : `<div class="empty">No jobs match. Lower the fit, or run <code>aavedan find</code>.</div>`;
    return;
  }
  const rows = apps.filter(a => (state.status === 'all' || a.status === state.status) && match(a.company, a.title, a.location, a.reason));
  v.innerHTML = rows.length ? `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Job</th><th>Status</th><th>Fit</th></tr></thead><tbody>${rows.map(a => `
    <tr><td>${when(a.at)}</td><td><a class="t" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">${esc(a.title)}</a><div class="r">${esc(a.company)} · ${esc(a.location)}</div>${a.reason ? `<div class="r">${esc(a.reason)}</div>` : ''}</td>
    <td><span class="chip ${esc(a.status)}">${esc(a.status)}</span></td><td>${a.fitScore ?? ''}</td></tr>`).join('')}</tbody></table></div>`
    : `<div class="empty">No applications yet.</div>`;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); const old = b.innerHTML; b.textContent = 'Copied'; setTimeout(() => (b.innerHTML = old), 1200); } catch {}
});

const root = document.documentElement;
const saved = store.get('theme', null);
if (saved) root.dataset.theme = saved;
$('#theme').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  store.set('theme', root.dataset.theme);
});

function render() { renderTabs(); renderTools(); renderView(); }
render();
</script>
</body>
</html>
